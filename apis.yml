name: Freespira
description: >-
  Freespira is a digital therapeutics company that provides an FDA-cleared,
  at-home, medication-free treatment for panic disorder and PTSD symptoms. The
  program pairs a compact breathing sensor with a tablet app that gives patients
  real-time feedback while they retrain their breathing across two 17-minute
  daily sessions over a 28-day course, supported by weekly check-ins with Care
  Specialists. Freespira is sold through health plans, employers, provider
  organizations, and veterans programs rather than as a public developer
  platform. It was surfaced as a portfolio company of Lightspeed Venture
  Partners and added to the API Evangelist network. No public API, developer
  portal, or machine-readable API specification was found during enrichment.
